name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nexcrypt
            package_dir: nexcrypt-linux-amd64
            archive_name: nexcrypt-linux-amd64.tar.gz

          - os: windows-latest
            artifact_name: nexcrypt.exe
            package_dir: nexcrypt-windows-amd64
            archive_name: nexcrypt-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      # ----------------------------
      # Install Dependencies
      # ----------------------------

      - name: Install libsodium (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Install libsodium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libsodium:x64-windows-static
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      # ----------------------------
      # Configure CMake
      # ----------------------------

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

          if (!(Test-Path $toolchain)) {
            Write-Error "Toolchain file not found!"
            exit 1
          }

          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      # ----------------------------
      # Build
      # ----------------------------

      - name: Build
        run: cmake --build build --config Release

      # ----------------------------
      # Package (Linux)
      # ----------------------------

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/${{ matrix.package_dir }}

          cp build/nexcrypt release/${{ matrix.package_dir }}/
          cp README.md release/${{ matrix.package_dir }}/

          cd release

          tar -czf ${{ matrix.archive_name }} ${{ matrix.package_dir }}

      # ----------------------------
      # Package (Windows)
      # ----------------------------

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/${{ matrix.package_dir }}"

          Copy-Item "build/Release/nexcrypt.exe" "release/${{ matrix.package_dir }}/"
          Copy-Item "README.md" "release/${{ matrix.package_dir }}/"

          Compress-Archive `
            -Path "release/${{ matrix.package_dir }}" `
            -DestinationPath "release/${{ matrix.archive_name }}"

      # ----------------------------
      # Upload Release Assets
      # ----------------------------

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}